[package]
name = "solaris-agent"
description = "Agent engine, collaboration runtime, sessions, and orchestration for Solaris Mesh"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
solaris-types.workspace     = true
solaris-protocol.workspace  = true
solaris-config.workspace    = true
solaris-providers.workspace = true
solaris-tools.workspace     = true
solaris-mcp.workspace       = true
solaris-skills.workspace    = true
solaris-memory.workspace    = true
solaris-compact.workspace   = true
solaris-process.workspace   = true

tracing.workspace     = true
tokio.workspace       = true
futures.workspace     = true
serde.workspace       = true
serde_json.workspace  = true
async-trait.workspace = true
anyhow.workspace      = true
thiserror.workspace   = true
glob.workspace        = true
chrono.workspace      = true
uuid.workspace        = true
dirs.workspace        = true
rusqlite.workspace    = true
crossterm.workspace   = true
is-terminal.workspace = true
sha2.workspace          = true
cap-std.workspace       = true
which.workspace         = true
workspace-hack.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
solaris-process = { path = "../solaris-process", features = ["sandbox-test-fixtures"] }
solaris-tools = { path = "../solaris-tools", features = ["sandbox-test-fixtures"] }
solaris-mcp = { path = "../solaris-mcp", features = ["test-utils"] }
rusqlite = { workspace = true, features = ["hooks"] }
tokio = { workspace = true, features = ["test-util"] }
wiremock.workspace    = true
tokio-test.workspace  = true
tempfile.workspace    = true
mockall.workspace     = true
rstest.workspace      = true
serial_test.workspace = true

# ── Integration test binaries ──────────────────────────────────────────────
[[test]]
name = "e2e"
path = "tests/e2e/mod.rs"
# E2E tests require real API keys; run via: cargo nextest run --profile e2e --test e2e

[[test]]
name = "acceptance"
path = "tests/acceptance/mod.rs"
# Acceptance tests for evolution features; run via: cargo nextest run --profile e2e --test acceptance
