[package]
name = "solaris-cli"
description = "Solaris Mesh CLI — lightweight access to the multi-agent runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["ai", "agent", "cli", "llm", "anthropic"]
categories = ["command-line-utilities"]

[[bin]]
name = "solaris"
path = "src/main.rs"

[dependencies]
agent-client-protocol.workspace = true
solaris-agent.workspace    = true
solaris-compact.workspace  = true
solaris-config.workspace   = true
solaris-memory.workspace   = true
solaris-providers.workspace = true
solaris-tools.workspace    = true
solaris-mcp.workspace      = true
solaris-protocol.workspace = true
solaris-process.workspace  = true
solaris-skills.workspace   = true
solaris-types.workspace    = true

tokio.workspace              = true
anyhow.workspace             = true
chrono.workspace             = true
serde_json.workspace         = true
clap.workspace               = true
tracing.workspace            = true
tracing-subscriber.workspace = true
uuid.workspace               = true
workspace-hack.workspace = true

[dev-dependencies]
async-trait.workspace = true
solaris-mcp = { workspace = true, features = ["test-utils"] }
solaris-process = { path = "../solaris-process", features = ["sandbox-test-fixtures"] }
tempfile.workspace = true
