[workspace]
resolver = "2"
members = [
    "crates/solaris-types",
    "crates/solaris-protocol",
    "crates/solaris-compact",
    "crates/solaris-process",
    "crates/solaris-config",
    "crates/solaris-providers",
    "crates/solaris-tools",
    "crates/solaris-mcp",
    "crates/solaris-skills",
    "crates/solaris-memory",
    "crates/solaris-agent",
    "crates/solaris-cli",
    "workspace-hack",
]
exclude = ["third_party/process_security_environment_spec"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Solaris-star/solaris-mesh"

[workspace.dependencies]
# Internal crates
solaris-types     = { path = "crates/solaris-types" }
solaris-protocol  = { path = "crates/solaris-protocol" }
solaris-compact   = { path = "crates/solaris-compact" }
solaris-process   = { path = "crates/solaris-process" }
solaris-config    = { path = "crates/solaris-config" }
solaris-providers = { path = "crates/solaris-providers" }
solaris-tools     = { path = "crates/solaris-tools" }
solaris-mcp       = { path = "crates/solaris-mcp" }
solaris-skills    = { path = "crates/solaris-skills" }
solaris-memory    = { path = "crates/solaris-memory" }
solaris-agent     = { path = "crates/solaris-agent" }

# Async runtime
tokio   = { version = "1", features = ["full"] }
futures = "0.3"

# HTTP client
# HTTP client — use rustls to avoid native OpenSSL dep during cross-compilation
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }

# Serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
uuid       = { version = "1", features = ["v7"] }

# Async trait support
async-trait = "0.1"

# CLI argument parsing
clap = { version = "4", features = ["derive", "env"] }

# Error handling
thiserror = "2"
anyhow    = "1"

# File globbing
glob = "0.3"
ignore = "0.4.25"

# Executable lookup for cross-platform shell detection
which = "8"

# LRU cache (for file state tracking)
lru = "0.18"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# TOML config parsing
toml = "1.0"

# YAML frontmatter parsing (for skill files)
serde_yaml = "0.9"

# XDG/platform config directory
dirs = "6"

# Embedded SQLite storage for the durable Runtime Ledger
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }

# Regular expressions (for argument substitution in skills)
regex = "1"

# Cryptographic digests for durable effect and plugin identities
sha2 = "0.10"
hmac = "0.12"

# Capability-based filesystem access for race-resistant workspace writes
cap-std = "4"
same-file = "1.0.6"

# File system change notification (for skill hot-reload)
notify = "8"

# Terminal color support
crossterm = "0.29"

# TTY detection
is-terminal = "0.4"

# AWS SigV4 signing (for Bedrock provider)
aws-sigv4            = "1"
aws-credential-types = { version = "1", features = ["hardcoded-credentials"] }
aws-config           = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-sts          = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client", "sigv4a"] }

# Pin rustls-webpki to fix RUSTSEC-2026-{0098,0099,0104}
rustls-webpki = "0.103.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.13.2", default-features = false, features = ["pem", "ring", "zeroize"] }
webpki-roots = "1"
zeroize = "1"

# JWT creation (for Vertex GCP service account auth)
jsonwebtoken = "10"

# Base64 encoding
base64 = "0.22"

# URL parsing
url = "2"

# Structured logging
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "registry"] }

# Agent Client Protocol (ACP) stdio agent transport
agent-client-protocol = "2.0.0"

unicode-width = "0.2.2"

# Unix file flags (O_NOFOLLOW) for secure bundled skill file extraction
libc = "0.2"
landlock = "=0.4.7"

# Windows process containment
windows-sys = "0.61"
flatbuffers = "=25.12.19"
process_security_environment_spec = { path = "third_party/process_security_environment_spec", version = "=0.8.0" }

# workspace-hack (managed by cargo-hakari for build speed)
workspace-hack = { path = "workspace-hack" }

# Test utilities
wiremock    = "0.6"
tokio-test  = "0.4"
tempfile    = "3"
mockall     = "0.15"
rstest      = "0.26"
serial_test = "3"
insta       = { version = "1", features = ["json"] }
